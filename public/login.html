<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12121a">
<title>Ingresar — Pase de Batalla</title>
<link rel="icon" href="/icons/icon-192.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="container login-container">
  <form id="login-form" class="card login-card">
    <div class="login-brand">🎮 Pase de Batalla</div>
    <p class="muted small">Ingresa la contraseña para continuar.</p>
    <input type="password" name="password" placeholder="Contraseña" autofocus required class="login-input">
    <p id="login-error" class="login-error" hidden></p>
    <button type="submit" class="btn-primary">Entrar</button>
  </form>
</main>
<script>
  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('login-error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.hidden = true;
    const password = form.password.value;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await res.json();
      if (data.ok) {
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get('next') || '/';
      } else {
        errorEl.textContent = data.error || 'Contraseña incorrecta';
        errorEl.hidden = false;
      }
    } catch (err) {
      errorEl.textContent = 'Sin conexión. Intenta de nuevo.';
      errorEl.hidden = false;
    }
  });
</script>
</body>
</html>
